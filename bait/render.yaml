databases:
  - name: bait-db
    plan: free
services:
  - type: web
    name: bait-app
    rootDir: bait
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bait-db
          property: connectionString
      - key: FAMILY_PASSWORD
        sync: false
