<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d5b">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>أغراض البيت</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2620;--mu:#8a7f70;--ac:#2f7d5b;--rd:#c0392b;--rd2:#fdeceb;--bd:#e7dfd1;--bl:#e3f0fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1916;--card:#26231f;--tx:#f1ebe0;--mu:#a09684;--ac:#5cc596;--rd:#ff7b6b;--rd2:#3d2421;--bd:#38332c;--bl:#1f3040}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:18px}
body.big{font-size:22px}
.w{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0 2px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
input[type=text],input[type=password]{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.two{display:flex;gap:8px}.two input:first-child{flex:2}.two input:last-child{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{font:inherit;font-size:.85em;padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn{font:inherit;font-weight:bold;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;margin-top:6px}
.sos{background:var(--rd);margin:0 0 12px;display:none}
.row{display:flex;align-items:center;gap:8px;font-size:.85em;color:var(--mu);margin:8px 0}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.item.u{border-color:var(--rd);background:var(--rd2)}
.top{display:flex;align-items:center;gap:8px}
.t{flex:1;font-size:1.1em}
.q{font-weight:bold;color:var(--ac)}
.m{display:block;font-size:.7em;color:var(--mu)}
.n{font-size:.85em;margin-top:4px}
.acts{display:flex;gap:8px;margin-top:10px}
.ok,.go{font:inherit;font-size:.8em;padding:10px 12px;border:0;border-radius:10px;color:#fff;background:var(--ac)}
.go{background:var(--bd);color:var(--tx)}.go.me{background:#2d6cdf;color:#fff}
.cl{display:inline-block;background:var(--bl);border-radius:8px;padding:2px 8px;font-size:.75em;margin-top:6px}
.x{font:inherit;border:0;background:none;color:var(--mu);font-size:1.2em;margin-inline-start:auto}
.done .t{text-decoration:line-through;color:var(--mu)}
h2{font-size:1em;margin:18px 0 8px}
.empty{color:var(--mu);text-align:center;padding:20px}
.me{font-size:.75em;color:var(--mu)} .me button,.lnk{font:inherit;border:0;background:none;color:var(--ac);text-decoration:underline}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);background:var(--ac);color:#fff;padding:14px;border-radius:14px;z-index:9;display:none;text-align:center}
.note{background:var(--card);border:1px dashed var(--bd);border-radius:12px;padding:10px;font-size:.8em;color:var(--mu);margin-bottom:12px;display:none}
.err{color:var(--rd);font-size:.85em;min-height:20px}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="w">
<h1>🏠 أغراض البيت</h1>
<p class="me" id="me"></p>

<div id="login" class="box" style="display:none">
  <input type="password" id="pw" placeholder="كلمة سر العيلة">
  <p style="margin:6px 0">مين أنت؟</p>
  <div class="chips"><button class="chip" data-n="ماما">ماما</button></div>
  <input type="text" id="nm" placeholder="أو اكتب اسمك (مثلاً: أحمد)">
  <div class="err" id="err"></div>
  <button class="btn" id="go">دخول</button>
</div>

<div id="app" style="display:none">
  <div class="note" id="ios">📱 على الآيفون: مشاركة ← "إضافة إلى الشاشة الرئيسية"، وافتح التطبيق من هناك لتوصلك الإشعارات.</div>
  <div class="note" id="pnote"><button class="lnk" id="pbtn">فعّل الإشعارات 🔔</button></div>
  <button class="btn sos" id="sos">📞 بدي حدا يتصل فيّ</button>
  <div class="box">
    <div class="two"><input type="text" id="txt" placeholder="شو لازمك؟"><input type="text" id="qty" placeholder="الكمية"></div>
    <div class="chips" id="quick"></div>
    <div class="chips" id="cats"></div>
    <input type="text" id="note" placeholder="ملاحظة (اختياري): الماركة، المحل...">
    <label class="row"><input type="checkbox" id="urg"> مستعجل ⚡</label>
    <div id="draft"></div>
    <button class="btn" id="more" style="background:var(--bd);color:var(--tx)">➕ زيد غرض ثاني</button>
    <button class="btn" id="add">أرسل للأولاد 📨</button>
  </div>
  <div class="chips" id="flt"></div>
  <h2>🛒 لازم تنجاب للبيت <span id="cnt"></span></h2>
  <div id="pend"></div>
  <h2>✅ انجابت</h2>
  <div id="done"></div>
</div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var S=function(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
var me=S("name"),pass=S("pass"),items=[],timer=null,cat="سوبرماركت",flt="الكل";
var CATS=["سوبرماركت","صيدلية","خضرة","مخبز","غير ذلك"],ICO={"سوبرماركت":"🛒","صيدلية":"💊","خضرة":"🥬","مخبز":"🥖","غير ذلك":"📦"};
var QUICK=[["خبز","مخبز"],["حليب","سوبرماركت"],["بيض","سوبرماركت"],["دوا","صيدلية"],["خضرة","خضرة"],["فواكه","خضرة"],["غاز","غير ذلك"],["مي","سوبرماركت"]];
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},4000)}
function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({"Content-Type":"application/json","x-pass":pass},opt.headers||{});
  return fetch(path,opt).then(function(r){if(r.status===401){logout();throw 0}return r.json()});
}
function post(p,b){return api(p,{method:"POST",body:JSON.stringify(Object.assign({by:me},b||{}))})}
function logout(){S("pass","");pass="";$("login").style.display="block";$("app").style.display="none";clearInterval(timer)}
function chips(el,list,cur,fn){el.innerHTML="";list.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===cur?" on":"");b.textContent=(ICO[c]||"")+" "+c;b.onclick=function(){fn(c)};el.appendChild(b)})}
function drawCats(){chips($("cats"),CATS,cat,function(c){cat=c;drawCats()});chips($("flt"),["الكل"].concat(CATS),flt,function(c){flt=c;drawCats();render()})}

document.querySelectorAll("[data-n]").forEach(function(b){b.onclick=function(){$("nm").value=b.dataset.n}});
$("go").onclick=function(){
  var n=$("nm").value.trim(),p=$("pw").value;
  if(!n){$("err").textContent="اكتب اسمك";return}
  fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:p})})
  .then(function(r){if(!r.ok){$("err").textContent="كلمة السر غلط";return}
    me=n;pass=p;S("name",n);S("pass",p);$("err").textContent="";start()});
};
QUICK.forEach(function(q){var b=document.createElement("button");b.className="chip";b.textContent=q[0];b.onclick=function(){draft.push({text:q[0],cat:q[1],qty:$("qty").value.trim(),note:"",urgent:$("urg").checked});$("qty").value="";drawDraft()};$("quick").appendChild(b)});

function fmt(ts){try{return new Date(ts).toLocaleString("ar",{weekday:"short",hour:"numeric",minute:"2-digit"})}catch(e){return ""}}
function render(){
  var all=items.filter(function(i){return !i.done}),p=all.filter(function(i){return flt==="الكل"||i.cat===flt}),d=items.filter(function(i){return i.done}).slice(0,15);
  p.sort(function(a,b){return (b.urgent?1:0)-(a.urgent?1:0)});
  $("cnt").textContent=all.length?"("+all.length+")":"";
  document.title=(all.length?"("+all.length+") ":"")+"أغراض البيت";
  $("pend").innerHTML=p.length?p.map(function(i){
    var mine=i.claimed_by===me;
    return "<div class='item"+(i.urgent?" u":"")+"'><div class='top'><div class='t'>"+(i.urgent?"⚡ ":"")+(ICO[i.cat]||"")+" "+esc(i.text)+(i.qty?" <span class='q'>· "+esc(i.qty)+"</span>":"")+"<span class='m'>من "+esc(i.by)+" · "+fmt(i.created_at)+"</span></div><button class='x' data-del='"+i.id+"'>×</button></div>"
    +(i.note?"<div class='n'>📝 "+esc(i.note)+"</div>":"")
    +(i.claimed_by?"<span class='cl'>🚶 "+esc(i.claimed_by)+" رايح يجيبها</span>":"")
    +"<div class='acts'><button class='ok' data-ok='"+i.id+"'>جبتها ✓</button><button class='go"+(mine?" me":"")+"' data-claim='"+i.id+"'>"+(mine?"ما عاد رايح":"أنا رايح 🚶")+"</button></div></div>";
  }).join(""):"<div class='empty'>ما في شي مطلوب 🎉</div>";
  $("done").innerHTML=d.length?d.map(function(i){
    return "<div class='item done'><div class='top'><div class='t'>"+esc(i.text)+(i.qty?" · "+esc(i.qty):"")+"<span class='m'>جابها "+esc(i.done_by||"")+"</span></div><button class='x' data-del='"+i.id+"'>×</button></div></div>";
  }).join(""):"<div class='empty'>—</div>";
}
function load(){api("/api/items").then(function(r){items=r;render()}).catch(function(){})}
document.addEventListener("click",function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.ok)post("/api/items/"+t.dataset.ok+"/done").then(load);
  if(t.dataset.claim)post("/api/items/"+t.dataset.claim+"/claim").then(load);
  if(t.dataset.del&&confirm("حذف؟"))api("/api/items/"+t.dataset.del,{method:"DELETE"}).then(load);
});
var draft=[];
function drawDraft(){
  $("draft").innerHTML=draft.map(function(d,k){return "<span class='cl' style='margin:0 0 6px 6px'>"+(ICO[d.cat]||"")+" "+esc(d.text)+(d.qty?" · "+esc(d.qty):"")+(d.urgent?" ⚡":"")+" <button class='x' data-dr='"+k+"' style='font-size:1em'>×</button></span>"}).join("");
  $("add").textContent="أرسل للأولاد 📨"+(draft.length?" ("+draft.length+")":"");
}
function cur(){
  var v=$("txt").value.trim();if(!v)return;
  draft.push({text:v,qty:$("qty").value.trim(),note:$("note").value.trim(),cat:cat,urgent:$("urg").checked});
  $("txt").value="";$("qty").value="";$("note").value="";$("urg").checked=false;
}
document.addEventListener("click",function(e){var k=e.target.dataset&&e.target.dataset.dr;if(k!=null&&k!==""){draft.splice(+k,1);drawDraft()}});
$("more").onclick=function(){cur();drawDraft();$("txt").focus()};
$("add").onclick=function(){
  cur();if(!draft.length)return;
  post("/api/items/bulk",{items:draft}).then(function(){draft=[];drawDraft();toast("انرسلت للأولاد ✓");load()});
};
$("txt").addEventListener("keydown",function(e){if(e.key==="Enter")$("more").click()});
$("sos").onclick=function(){if(confirm("نبعت للأولاد إنك بدك اتصال؟"))post("/api/sos").then(function(){toast("انرسلت، رح يتصلوا فيك 📞")})};

function b64(s){var p="=".repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,"+").replace(/_/g,"/"),r=atob(b),o=new Uint8Array(r.length);for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o}
function enablePush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window))return Promise.resolve(false);
  return Notification.requestPermission().then(function(p){
    if(p!=="granted")return false;
    return navigator.serviceWorker.ready.then(function(reg){
      return api("/api/vapid").then(function(v){
        return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(v.key)})});
      }).then(function(sub){return post("/api/subscribe",{sub:sub,name:me})}).then(function(){return true});
    });
  }).catch(function(){return false});
}
$("pbtn").onclick=function(){enablePush().then(function(ok){$("pnote").style.display=ok?"none":"block";toast(ok?"تفعلت الإشعارات 🔔":"ما انفعلت. تأكد من إذن الإشعارات")})};

function start(){
  $("login").style.display="none";$("app").style.display="block";
  var mom=me==="ماما";document.body.classList.toggle("big",mom);$("sos").style.display=mom?"block":"none";
  $("me").innerHTML="أهلاً "+esc(me)+" · <button id='sw'>تسجيل خروج</button>";
  $("sw").onclick=function(){S("name","");logout();$("me").textContent=""};
  var ios=/iphone|ipad/i.test(navigator.userAgent),standalone=window.navigator.standalone||matchMedia("(display-mode: standalone)").matches;
  if(ios&&!standalone)$("ios").style.display="block";
  if("Notification" in window){
    if(Notification.permission==="granted")enablePush();
    else if(Notification.permission==="default"&&(!ios||standalone))$("pnote").style.display="block";
  }
  drawCats();load();clearInterval(timer);timer=setInterval(load,15000);
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
document.addEventListener("visibilitychange",function(){if(!document.hidden&&pass)load()});
if(me&&pass)start();else{$("login").style.display="block";if(me)$("nm").value=me}
})();
</script>
</body>
</html>
